[project]
name = "serviceregistrator"
version = "0.5.3"
description = "Bridge betwen docker and consul services, inspired by registrator"
authors = [{name = "Laurent Monin", email = "zas@metabrainz.org"}]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["consul", "docker", "service registration"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=7.1.2",
    "docker>=4.4.1",
    "python-consul2>=0.1.5",
    "requests<2.29.0",
    "urllib3<2.0",
]

[project.scripts]
serviceregistrator = "serviceregistrator.main:main"

[project.urls]
Repository = "https://github.com/metabrainz/serviceregistrator"

[dependency-groups]
dev = [
    "flake8>=3.8.4",
    "pytest>=6.2.2",
    "wheel>=0.36.2",
    "pytest-cov>=2.11.1",
    "pylint>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
