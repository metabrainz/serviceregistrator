[project]
name = "serviceregistrator"
version = "0.8.0"
description = "Bridge betwen docker and consul services, inspired by registrator"
authors = [{name = "Laurent Monin", email = "zas@metabrainz.org"}]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["consul", "docker", "service registration"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.3.2",
    "docker>=4.4.1",
    "requests>=2.33.1",
    "urllib3>=1.26.0",
]

[project.scripts]
serviceregistrator = "serviceregistrator.main:main"

[project.urls]
Repository = "https://github.com/metabrainz/serviceregistrator"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: require Docker and Consul (deselected by default)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
